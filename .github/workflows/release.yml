name: Release

# Every push to main builds the Windows installer and publishes it as a GitHub Release.
# Installed copies of the app pick it up automatically.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Auto-update needs a strictly increasing version; derive it from the run number.
      - run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - run: npm run build
      # GitHub rejects a release whose tag doesn't exist yet, so create the tag first.
      - name: Tag this commit
        run: |
          git tag "v0.1.${{ github.run_number }}"
          git push origin "v0.1.${{ github.run_number }}"
      # Build only. electron-builder's own publisher races itself and splits one release in two.
      - run: npx electron-builder --win nsis --publish never
      - name: Publish release
        run: >
          gh release create "v0.1.${{ github.run_number }}"
          "dist/Skills-Dashboard-Setup-0.1.${{ github.run_number }}.exe"
          "dist/Skills-Dashboard-Setup-0.1.${{ github.run_number }}.exe.blockmap"
          "dist/latest.yml"
          --title "v0.1.${{ github.run_number }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
