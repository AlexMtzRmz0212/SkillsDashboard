appId: com.alexmtz.skillsdashboard
productName: Skills Dashboard
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - build/icon.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Skills Dashboard
publish:
  provider: github
  owner: AlexMtzRmz0212
  repo: SkillsDashboard
  releaseType: release
npmRebuild: false
